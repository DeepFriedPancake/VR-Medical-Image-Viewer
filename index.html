<!doctype html>
<html>
    <head>
        <title>View CT scan files in VR</title>
        <script src="https://cdn.jsdelivr.net/pyodide/v314.0.3/full/pyodide.js"></script>
        <script src="setup_pyodide.js"></script>
        
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="setup_aframe.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/aframe-htmlmesh@2.7.0/build/aframe-html.min.js"></script>
        <link href="index.css" rel="stylesheet">
    </head>
    <body>
        <a-scene renderer="sortTransparentObjects: true;">
            <a-assets>
            </a-assets>

            <a-sphere color="black" radius="0.005" id="cursor" material="shader:flat" visible="false"></a-sphere>
            <!-- <a-sphere color="yellow" radius="0.01" id="cursor" material="shader:flat" position="0.2 1.6 -0.2"></a-sphere> -->
            <a-entity html="cursor:#cursor; html:#select-file-ui;" position="0.4 1.6 -0.4" rotation="0 -45 0"></a-entity>

            <a-entity id="model-obj-parent" rotation="-90 180 0" position="0 1.5 -0.3"></a-entity>
    
            <a-sky color="#ECECEC"></a-sky>
            <a-entity id="rig" position="0 0 0">
                <a-entity camera="active: true" look-controls wasd-controls="acceleration: 6; fly: true;" position="0 1.6 0"></a-entity>
                
                <!-- Hand tracking -->
			    <a-entity handy-controls="materialOverride:both;" material="color:gold;metalness:1;roughness:0;">
				    <!-- These also do teleportaion for Blink controls in VR -->
				    <!-- These are present for hand tracking but hands don't have joysticks so do nothing -->
				    <!-- <a-entity data-right="ray" mixin="blink" cursor raycaster="showLine: true; far: 100; lineColor: red; objects: [html]; interval:100;"></a-entity> -->
				    <!-- <a-entity data-left="ray" mixin="blink" cursor raycaster="showLine: true; far: 100; lineColor: red; objects: [html]; interval:100;"></a-entity> -->
                </a-entity>
            </a-entity>
        </a-scene>

        <section id="select-file-ui" class="choices-panel">
            <h2>View CT scan files in VR</h2>
            Choices: <br>
            MosMed COVID19 dataset subject 0205 (.nii) <button id="show-mosmed-0205" onclick="show_button_pressed()">show</button> <br>
            <span id="status-show"></span>
            <!-- taytos brayden clavicular rosk mosk reimu fumo haleema aardavark tolstoy cotash nubela jujimax -->
        </section>
  </body>
</html>
